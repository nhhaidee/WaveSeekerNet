name: waveseekernet
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  - numpy>=1.26.4
  - scikit-learn>=1.5.1
  - pywavelets
  - biopython>=1.80
  - pytorch::pytorch>=2.4.1
  - pytorch::pytorch-cuda=12.1
  - pip:
    - pytorch-wavelets>=1.3.0
    - pytorch-optimizer>=3.1.1
    - torchinfo==1.8.0
    - shap==0.48.0
    - complexcgr
    - -e .
