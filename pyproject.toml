[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveseekernet"
description = "Accurate Prediction of Influenza A Virus Subtypes and Host Source Using Attention-Based Deep Learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hai Nguyen", email = "your.email@example.com" },
    { name = "Josip Rudar", email = "josip.rudar@example.com" },
]
keywords = ["deep learning", "influenza", "genomics", "bioinformatics", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.1",
    "pytorch_wavelets>=1.3.0",
    "pytorch_optimizer>=3.1.1",
    "scikit-learn>=1.5.1",
    "numpy>=1.26.4",
    "torchinfo==1.8.0",
    "shap==0.48.0",
    "PyWavelets",
    "biopython>=1.80",
    "complexcgr",
    "pandas",
    "matplotlib",
    "seaborn",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build",
    "twine",
    "mypy>=1.0.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/nhhaidee/WaveSeekerNet"
Repository = "https://github.com/nhhaidee/WaveSeekerNet.git"
"Bug Tracker" = "https://github.com/nhhaidee/WaveSeekerNet/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.dynamic]
version = {attr = "WaveSeekerNet.__version__"}

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes lints
    "I",    # isort (import sorting)
    "B",    # flake8-bugbear (common bug patterns)
    "UP",   # pyupgrade (modernize Python syntax)
]