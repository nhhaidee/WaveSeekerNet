[build-system]
requires = ["setuptools<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "waveseekernet"
version = "0.1.0"
description = "Accurate Prediction of Influenza A Virus Subtypes and Host Source Using Attention-Based Deep Learning"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hai Nguyen" },
    { name = "Josip Rudar" },
]
keywords = ["deep learning", "influenza", "genomics", "bioinformatics", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "torch==2.4.1",
    "pytorch_wavelets>=1.3.0",
    "pytorch_optimizer>=3.1.1",
    "scikit-learn>=1.5.1",
    "numpy>=1.26.4",
    "biopython>=1.84",
    "pandas>=2.2.2",
    "pyfastx>=2.1.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.9.1",
    "baycomp>=1.0.3",
    "PyWavelets",         # pywt — required by pytorch_wavelets
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/nhhaidee/WaveSeekerNet"
"Bug Tracker" = "https://github.com/nhhaidee/WaveSeekerNet/issues"
Preprint = "https://www.biorxiv.org/content/10.1101/2025.02.25.639900v2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
"WaveSeekerNet" = ["py.typed"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
